# Resound Theme Default Configuration

# Enable emoji support
enableEmoji = true

# Pagination
[pagination]
  pagerSize = 10
  path = 'page'

# Taxonomies
[taxonomies]
  category = 'categories'
  tag = 'tags'

# Output formats
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']

# Markup / syntax highlight
[markup]
  [markup.highlight]
    noClasses = false
    style = 'github'

# Sitemap configuration
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[params]
  logo = '/logo.png'
  # Default content settings
  recent_post = 10
  
  # Palette: 'resound' (brick red on white) or 'secevo' (evolution green on paper).
  # Each ships a light and a dark half; see README.
  palette = 'resound'

  # Font configuration
  enable_lxgw_wenkai = true
  lxgw_wenkai_cdn = 'https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.min.css'
  
  # Comment system defaults (Giscus)
  [params.giscus]
    # Theme names follow https://giscus.app/themes
    theme_light = 'light'
    theme_dark = 'dark_dimmed'
  
  # Mermaid configuration (on-demand loading)
  [params.mermaid]
    startOnLoad = true
    theme = 'default'
    securityLevel = 'loose'
    autoDark = true
