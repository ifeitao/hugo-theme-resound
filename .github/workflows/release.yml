name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # no go.sum: the tool is stdlib-only, so the module cache is pointless
          # (without this the runner logs "Restore cache failed")
          cache: false
          go-version: '1.22'
      - name: Test
        run: go test ./tools/...
      - name: Build revise
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p dist
          out="dist/revise_${GOOS}_${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "$out" ./tools/cmd/revise
          (cd dist && sha256sum "revise_${GOOS}_${GOARCH}${ext}" > "revise_${GOOS}_${GOARCH}${ext}.sha256")
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/revise_*

  # The theme needs no build step. This job proves the working copy still
  # renders: it builds the example content against this checkout, in a throwaway
  # site, so it does not depend on the module version pinned in exampleSite.
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the example content builds with this theme
        env:
          HUGO_VERSION: '0.152.2'
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" | tar xz -C /usr/local/bin hugo
          hugo version
          rm -rf /tmp/verify && mkdir -p /tmp/verify
          cp -R exampleSite/content /tmp/verify/content
          printf 'baseURL = "https://example.org/"\ntitle = "verify"\ntheme = "resound"\n' > /tmp/verify/hugo.toml
          mkdir -p /tmp/themes && ln -sfn "$PWD" /tmp/themes/resound
          hugo -s /tmp/verify --themesDir /tmp/themes --minify --logLevel warn
          test -f /tmp/verify/public/index.html
